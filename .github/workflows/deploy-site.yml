name: Deploy site to sb2k16.github.io

# Builds web/ (which reads chapters/*.md) and publishes the static output to the
# sb2k16.github.io repo, which GitHub serves at https://sb2k16.github.io/.
#
# Cross-repo, so it needs a token that can push to the OTHER repo — the built-in
# GITHUB_TOKEN is scoped to this repo only. Create a fine-grained PAT with
# "Contents: read and write" on sb2k16/sb2k16.github.io and add it here as the
# repo secret PAGES_DEPLOY_TOKEN (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changed.
    paths:
      - 'chapters/**'
      - 'web/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Publish to sb2k16.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: sb2k16/sb2k16.github.io
          publish_branch: main
          publish_dir: web/dist
          # If a custom domain is added later, drop it in web/public/CNAME and it
          # ships automatically — no change needed here.
